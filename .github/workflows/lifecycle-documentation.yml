name: Lifecycle documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle-documentation:
    name: Require all lifecycle documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify lifecycle document participation
        run: ./scripts/check-lifecycle-docs.sh "origin/${{ github.base_ref }}"
