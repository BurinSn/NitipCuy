name: Lifecycle documentation

on:
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle-documentation:
    name: Require all lifecycle documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify lifecycle document participation
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ./scripts/check-lifecycle-docs.sh "$BASE_REF"

      - name: Check base freshness against the base ref
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ./scripts/check-base-freshness.sh "$BASE_REF" merge

      - name: Check canonical-block edit freshness
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-canonical-blocks.mjs "$BASE_REF"
